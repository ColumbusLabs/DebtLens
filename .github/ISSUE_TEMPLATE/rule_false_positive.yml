name: Rule false positive
description: Report a finding that should not fire for a rule.
title: "False positive: "
labels: ["bug", "type: false-positive"]
body:
  - type: markdown
    attributes:
      value: |
        Rule taxonomy: [docs/rule-packs.md](https://github.com/ColumbusLabs/DebtLens/blob/main/docs/rule-packs.md)
  - type: input
    id: rule
    attributes:
      label: Rule id
      placeholder: "large-component"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Source language or pack
      options:
        - TypeScript / JavaScript
        - React / TSX
        - React Native
        - Next.js
        - Node
        - Python
        - Local plugin
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DebtLens version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal code sample
      description: Paste the smallest code sample that reproduces the finding.
      render: text
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and config
      description: Include command, thresholds, min severity, pack, plugins, and config settings.
      render: shell
    validations:
      required: true
  - type: textarea
    id: why_false
    attributes:
      label: Why this is a false positive
      description: Explain the legitimate pattern DebtLens should allow.
    validations:
      required: true
  - type: textarea
    id: scan-artifact
    attributes:
      label: ScanResult or reporter artifact
      description: Paste the relevant JSON issue, SARIF result, PR comment excerpt, or artifact path if available.
      render: json
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What fixture or test should pass once this is fixed?
