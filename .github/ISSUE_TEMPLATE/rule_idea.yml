name: Rule idea
description: Propose a new maintainability rule or detector improvement.
title: "Rule idea: "
labels: ["enhancement", "area: detector"]
body:
  - type: markdown
    attributes:
      value: |
        See [docs/rule-packs.md](https://github.com/ColumbusLabs/DebtLens/blob/main/docs/rule-packs.md) for core vs framework pack taxonomy.
  - type: dropdown
    id: layer
    attributes:
      label: Rule layer
      description: Where does this rule belong?
      options:
        - core (any TS/JS project)
        - react pack (components, hooks, props)
        - react-native pack
        - next pack
        - node pack
        - python pack
        - local plugin rule
        - other framework pack
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Maintainer problem
      description: What review burden or debt pattern would this rule help catch?
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Code examples
      description: Include one example that should fire and one near-miss that should not. Note the language if it is not TSX.
      render: text
    validations:
      required: true
  - type: textarea
    id: signal
    attributes:
      label: Signal and confidence
      description: What evidence should make this high-confidence rather than noisy?
  - type: textarea
    id: config
    attributes:
      label: Configuration or thresholds
      description: Note any threshold, severity, or project-specific tuning needed.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What tests and docs should exist when this is implemented?
  - type: textarea
    id: reporter-impact
    attributes:
      label: Reporter or artifact impact
      description: Note whether JSON, SARIF, Markdown, PR comments, HTML, JUnit, or Action summaries need new output.
