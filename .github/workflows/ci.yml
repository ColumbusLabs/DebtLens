name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm test
      - run: npm run build
      - name: Verify source/runtime pack parity
        run: |
          node --import tsx src/cli/index.ts packs --format json > /tmp/debtlens-source-packs.json
          node dist/cli/index.js packs --format json > /tmp/debtlens-dist-packs.json
          diff -u /tmp/debtlens-source-packs.json /tmp/debtlens-dist-packs.json
          node dist/cli/index.js scan examples/python --pack python --format json --output debtlens-python-report.json
          node dist/cli/index.js scan examples/python-web --pack python-web --format json --output debtlens-python-web-report.json
          node dist/cli/index.js scan examples/kotlin --pack kotlin --format json --output debtlens-kotlin-report.json
          node dist/cli/index.js scan examples/compose --pack compose --format json --output debtlens-compose-report.json
      - name: Benchmark regression gate
        run: npm run benchmark:ci
        env:
          DEBTLENS_BENCHMARK_BUDGETS: small=5000
      - run: node dist/cli/index.js scan examples/react --min-severity info --format markdown --output debtlens-react-report.md
      - run: node dist/cli/index.js scan examples/react-native --min-severity info --format markdown --output debtlens-react-native-report.md
      - run: node dist/cli/index.js scan examples/next --min-severity info --format markdown --output debtlens-next-report.md
      - run: node dist/cli/index.js scan examples/python --pack python --min-severity info --format markdown --output debtlens-python-report.md
      - run: node dist/cli/index.js scan examples/python-web --pack python-web --min-severity info --format markdown --output debtlens-python-web-report.md
      - run: node dist/cli/index.js scan examples/kotlin --pack kotlin --min-severity info --format markdown --output debtlens-kotlin-report.md
      - run: node dist/cli/index.js scan examples/compose --pack compose --min-severity info --format markdown --output debtlens-compose-report.md
