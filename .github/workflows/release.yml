name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:all
      - run: npm run build
      - run: npm pack
      - name: Package self-contained Action runtime
        run: |
          mkdir -p .release/action/scripts
          cp action.yml package.json package-lock.json .release/action/
          cp -R dist .release/action/dist
          cp scripts/prepare-action-runtime.sh scripts/render-scan-result.mjs scripts/append-step-summary.mjs scripts/post-pr-comment.mjs .release/action/scripts/
          npm ci --omit=dev --prefix .release/action
          tar -C .release/action -czf debtlens-action-dist.tgz .
          sha256sum debtlens-action-dist.tgz | tee debtlens-action-dist.tgz.sha256
      - name: Upload npm package tarball
        uses: actions/upload-artifact@v4
        with:
          name: debtlens-npm-package
          path: debtlens-*.tgz
      - name: Upload built Action runtime
        uses: actions/upload-artifact@v4
        with:
          name: debtlens-action-dist
          path: |
            debtlens-action-dist.tgz
            debtlens-action-dist.tgz.sha256
      - name: Attach release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            debtlens-*.tgz
            debtlens-action-dist.tgz
            debtlens-action-dist.tgz.sha256
